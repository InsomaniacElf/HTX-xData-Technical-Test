services:
  asr-api:
    build:
      context: .
      dockerfile: asr/Dockerfile
    ports:
      - "8001:8001"
    gpus: all
    shm_size: 1gb
    volumes:
      - asr-model-cache:/root/.cache/huggingface
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

volumes:
  asr-model-cache:
